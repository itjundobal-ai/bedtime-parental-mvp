name: Build New Parent APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/parentapp/**'
      - 'android/settings.gradle.kts'
      - '.github/workflows/build-parent-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build new Parent debug APK
        run: gradle :parentapp:assembleDebug --stacktrace
      - name: Upload new Parent APK
        uses: actions/upload-artifact@v4
        with:
          name: bedtime-parent-new-apk
          path: android/parentapp/build/outputs/apk/debug/parentapp-debug.apk
